<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Analytics Dashboard</title>

    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Подключаем React и ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Подключаем Babel для компиляции JSX прямо в браузере -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useState, useRef, useCallback } = React;

        // Массив всех доступных рынков.
        const MARKETS = ['BTC', 'SOL', 'ETH'];
        const REFRESH_INTERVAL_SEC = 60;

        function AnalyticsDashboard() {
            // Вариант 3: Инициализация вкладки из sessionStorage
            const [activeTab, setActiveTab] = useState(() => {
                const savedTab = sessionStorage.getItem('activeTab');
                return MARKETS.includes(savedTab) ? savedTab : MARKETS[0];
            });

            const [activeStream, setActiveStream] = useState('all');
            const [data, setData] = useState(null);
            const [losses, setLosses] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Состояние таймера автообновления
            const [lastUpdated, setLastUpdated] = useState(null);
            const [secondsLeft, setSecondsLeft] = useState(REFRESH_INTERVAL_SEC);
            const [isAutoRefreshEnabled, setIsAutoRefreshEnabled] = useState(true);

            // Функция загрузки данных
            const fetchData = useCallback((isInitial = false) => {
                if (isInitial) {
                    setLoading(true);
                }
                setError(null);

                const baseUrl = `https://polymarket-smoke-${activeTab.toLowerCase()}.up.railway.app`;

                Promise.all([
                    fetch(`${baseUrl}/analytics/summary`).then((res) => {
                        if (!res.ok) throw new Error(`Ошибка сети (${activeTab}, summary). Проверьте CORS или доступность бекенда.`);
                        return res.json();
                    }),
                    fetch(`${baseUrl}/analytics/losses?limit=50`).then((res) => {
                        if (!res.ok) throw new Error(`Ошибка сети (${activeTab}, losses). Проверьте CORS или доступность бекенда.`);
                        return res.json();
                    }),
                ])
                    .then(([summaryJson, lossesJson]) => {
                        setData(summaryJson);
                        setLosses(lossesJson);
                        setLoading(false);
                        setLastUpdated(new Date());
                        setSecondsLeft(REFRESH_INTERVAL_SEC);
                    })
                    .catch((err) => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, [activeTab]);

            // Сохранение переключенной вкладки в sessionStorage и первичный запрос
            const handleTabChange = (market) => {
                setActiveTab(market);
                sessionStorage.setItem('activeTab', market);
                setActiveStream('all');
            };

            // Запрос при смене активного таба
            useEffect(() => {
                fetchData(true);
            }, [fetchData]);

            // Эффект для обратного отсчета и таймера автообновления каждые 60 секунд
            useEffect(() => {
                if (!isAutoRefreshEnabled) return;

                const timer = setInterval(() => {
                    setSecondsLeft((prev) => {
                        if (prev <= 1) {
                            fetchData(false);
                            return REFRESH_INTERVAL_SEC;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [isAutoRefreshEnabled, fetchData]);

            // Переключение активности автообновления по клику на футер
            const toggleAutoRefresh = () => {
                if (!isAutoRefreshEnabled) {
                    setIsAutoRefreshEnabled(true);
                    fetchData(false); // сразу подтягиваем свежие данные при повторном включении
                } else {
                    setIsAutoRefreshEnabled(false);
                }
            };

            const renderContent = () => {
                if (loading) return <div className="py-12 text-center text-gray-500 font-sans">Загрузка аналитики {activeTab}...</div>;
                if (error || !data) return <div className="py-12 text-center text-red-500 font-sans">Ошибка: {error}</div>;

                const winRate = data.totals.wins + data.totals.losses > 0
                    ? ((data.totals.wins / (data.totals.wins + data.totals.losses)) * 100).toFixed(1)
                    : 0;

                const streamKeys = [...new Set((data.byAsset || []).map((a) => a.assetPrefix))].sort();
                const inStream = (key) => activeStream === 'all' || key === activeStream;

                const filteredByAsset = (data.byAsset || []).filter((a) => inStream(a.assetPrefix));
                const filteredBestByStream = (data.bestByStream || []).filter((a) => inStream(a.streamKey));
                const filteredAttempts = (data.attempts || []).filter((a) => inStream(a.streamKey));
                const filteredLosses = (losses || []).filter((l) => inStream(l.assetPrefix));
                const filteredStale = (data.staleUnresolved || []).filter((s) => inStream(s.assetPrefix));

                const streamSummary = filteredByAsset.reduce(
                    (acc, r) => ({ wins: acc.wins + r.wins, losses: acc.losses + r.losses, profit: acc.profit + r.profit }),
                    { wins: 0, losses: 0, profit: 0 },
                );

                return (
                    <div className="animate-fade-in transition-opacity">
                        {filteredStale.length > 0 && (
                            <div className="bg-amber-50 border border-amber-300 text-amber-800 rounded-xl p-4 mb-8">
                                <div className="font-semibold mb-2">⚠ Есть маркеты, зависшие в pending_resolve дольше нормы</div>
                                <ul className="text-sm space-y-1">
                                    {filteredStale.map((s) => (
                                        <li key={s.slug}>
                                            {s.assetPrefix} / {s.slug} — висит {s.ageSec}с (с {new Date(s.createdAt).toLocaleString()})
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}

                        {/* Табы по потокам внутри текущего бэкенда */}
                        {streamKeys.length > 0 && (
                            <div className="flex flex-wrap gap-1 bg-gray-200/50 p-1 rounded-lg mb-6 w-fit">
                                <button
                                    onClick={() => setActiveStream('all')}
                                    className={`px-4 py-1.5 rounded-md font-medium text-sm transition-all duration-200 ${
                                        activeStream === 'all' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'
                                    }`}
                                >
                                    Все
                                </button>
                                {streamKeys.map((key) => (
                                    <button
                                        key={key}
                                        onClick={() => setActiveStream(key)}
                                        className={`px-4 py-1.5 rounded-md font-medium text-sm transition-all duration-200 ${
                                            activeStream === key ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        {key}
                                    </button>
                                ))}
                            </div>
                        )}

                        {/* Топ метрики */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                            <MetricCard title="Bankroll (Smoke)" value={`$${data.currentBankroll.smoke}`} />
                            <MetricCard title="Win Rate" value={`${winRate}%`} subtext={`${data.totals.wins}W / ${data.totals.losses}L`} />
                            <MetricCard title="Markets Scanned" value={data.totals.marketsScanned} />
                            <MetricCard title="Bets Placed" value={data.totals.betsPlaced} />
                        </div>

                        {/* Сколько именно принёс/заработал/проиграл ВЫБРАННЫЙ поток */}
                        {activeStream !== 'all' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                <MetricCard title={`${activeStream} — Wins`} value={streamSummary.wins} />
                                <MetricCard title={`${activeStream} — Losses`} value={streamSummary.losses} />
                                <MetricCard
                                    title={`${activeStream} — Profit`}
                                    value={`${streamSummary.profit >= 0 ? '+' : ''}$${streamSummary.profit.toFixed(2)}`}
                                />
                            </div>
                        )}

                        {/* Лучшая попытка по каждому независимому потоку */}
                        {filteredBestByStream.length > 0 && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                {filteredBestByStream.map((a) => (
                                    <div key={a.streamKey} className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                        <h2 className="text-sm font-semibold mb-1 text-gray-500 uppercase tracking-wide">{a.streamKey}</h2>
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-sm font-medium text-gray-600">
                                                Step {a.reachedStep} of {a.targetSteps}
                                            </span>
                                            <span className={`px-3 py-1 rounded-full text-xs font-semibold uppercase ${a.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                {a.status}
                                            </span>
                                        </div>
                                        <ProgressBar reached={a.reachedStep} target={a.targetSteps} />
                                        <p className="text-xs text-gray-500 mt-2">Attempt #{a.attemptNumber} — current stake ${Number(a.currentStake).toFixed(2)}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* История попыток */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-8">
                            <div className="p-6 border-b border-gray-100">
                                <h2 className="text-xl font-semibold text-gray-800">Attempts History{activeStream !== 'all' ? ` — ${activeStream}` : ''}</h2>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-600 text-sm">
                                            <th className="p-4 font-medium">Stream</th>
                                            <th className="p-4 font-medium">Attempt</th>
                                            <th className="p-4 font-medium">Status</th>
                                            <th className="p-4 font-medium">Progress</th>
                                            <th className="p-4 font-medium">Stake</th>
                                            <th className="p-4 font-medium">Started</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {filteredAttempts.map((attempt) => (
                                            <tr key={`${attempt.isSmoke}-${attempt.streamKey}-${attempt.attemptNumber}`} className="hover:bg-gray-50 transition-colors">
                                                <td className="p-4 text-xs text-gray-500">{attempt.streamKey}</td>
                                                <td className="p-4 font-medium">#{attempt.attemptNumber}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded-md text-xs font-semibold uppercase ${attempt.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                        {attempt.status}
                                                    </span>
                                                </td>
                                                <td className="p-4 w-1/3">
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-xs text-gray-500 w-12">{attempt.reachedStep}/{attempt.targetSteps}</span>
                                                        <ProgressBar reached={attempt.reachedStep} target={attempt.targetSteps} />
                                                    </div>
                                                </td>
                                                <td className="p-4 text-sm text-gray-500">${Number(attempt.currentStake).toFixed(2)}</td>
                                                <td className="p-4 text-sm text-gray-500">
                                                    {new Date(attempt.createdAt).toLocaleString()}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Разбор сливов */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="p-6 border-b border-gray-100">
                                <h2 className="text-xl font-semibold text-gray-800">Recent Losses — Diagnostics{activeStream !== 'all' ? ` (${activeStream})` : ''}</h2>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-600 text-sm">
                                            <th className="p-4 font-medium">Date</th>
                                            <th className="p-4 font-medium">Market</th>
                                            <th className="p-4 font-medium">Side</th>
                                            <th className="p-4 font-medium">Profit</th>
                                            <th className="p-4 font-medium">ATR ratio (entry)</th>
                                            <th className="p-4 font-medium">Reason</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {filteredLosses.length === 0 && (
                                            <tr><td className="p-4 text-sm text-gray-400" colSpan="6">Сливов пока нет.</td></tr>
                                        )}
                                        {filteredLosses.map((log) => (
                                            <tr key={log.slug} className="hover:bg-gray-50 transition-colors align-top">
                                                <td className="p-4 text-sm text-gray-500 whitespace-nowrap">
                                                    {log.resolvedAt ? new Date(log.resolvedAt).toLocaleString() : '—'}
                                                </td>
                                                <td className="p-4 text-sm">
                                                    <div className="font-medium">{log.assetPrefix}</div>
                                                    <div className="text-gray-400">{log.slug}</div>
                                                </td>
                                                <td className="p-4 text-sm">{log.chosenOutcome ?? '—'}</td>
                                                <td className="p-4 text-sm text-red-600 font-medium">
                                                    {log.profit != null ? `$${log.profit.toFixed(2)}` : '—'}
                                                </td>
                                                <td className="p-4 text-sm">
                                                    {log.atrRatioAtEntry != null ? `${log.atrRatioAtEntry.toFixed(2)}x` : '—'}
                                                </td>
                                                <td className="p-4 text-sm text-gray-600 max-w-md">{log.failReason ?? '—'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            // Сколько секунд прошло с момента последнего обновления
            const timeSinceUpdate = lastUpdated
                ? Math.floor((new Date() - lastUpdated) / 1000)
                : 0;

            return (
                <div className="min-h-screen flex flex-col justify-between max-w-6xl mx-auto p-6 font-sans text-gray-800">
                    <div>
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                            <h1 className="text-3xl font-bold text-gray-900">Bot Analytics Dashboard</h1>

                            {/* Навигация табов */}
                            <div className="flex flex-wrap gap-1 bg-gray-200/50 p-1 rounded-lg">
                                {MARKETS.map((market) => (
                                    <button
                                        key={market}
                                        onClick={() => handleTabChange(market)}
                                        className={`px-6 py-2 rounded-md font-medium text-sm transition-all duration-200 ${
                                            activeTab === market
                                                ? 'bg-white text-blue-600 shadow-sm'
                                                : 'text-gray-500 hover:text-gray-700'
                                        }`}
                                    >
                                        {market}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Отрисовка контента */}
                        {renderContent()}
                    </div>

                    {/* Интерактивный футер с информацией об автообновлении */}
                    <footer className="mt-12 pt-6 border-t border-gray-200 text-center text-xs text-gray-500">
                        <div
                            onClick={toggleAutoRefresh}
                            className="inline-flex items-center gap-2 cursor-pointer select-none bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-full transition-colors"
                            title="Нажмите, чтобы включить/отключить автообновление"
                        >
                            <span className={`w-2 h-2 rounded-full ${isAutoRefreshEnabled ? 'bg-green-500 animate-pulse' : 'bg-red-400'}`}></span>
                            {isAutoRefreshEnabled ? (
                                <span>
                                    Обновлено {timeSinceUpdate} сек. назад • Следующее через {secondsLeft} сек. <span className="text-gray-400">(нажмите для паузы)</span>
                                </span>
                            ) : (
                                <span className="font-medium text-amber-700">
                                    Автообновление: отключено <span className="text-gray-400">(нажмите, чтобы включить)</span>
                                </span>
                            )}
                        </div>
                    </footer>
                </div>
            );
        }

        // Вспомогательные компоненты
        function MetricCard({ title, value, subtext }) {
            return (
                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-center">
                    <span className="text-sm text-gray-500 font-medium mb-1">{title}</span>
                    <span className="text-2xl font-bold text-gray-900">{value}</span>
                    {subtext && <span className="text-xs text-gray-400 mt-1">{subtext}</span>}
                </div>
            );
        }

        function ProgressBar({ reached, target }) {
            const percentage = Math.min((reached / target) * 100, 100);
            return (
                <div className="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                    <div
                        className="bg-blue-600 h-2.5 rounded-full transition-all duration-500 ease-in-out"
                        style={{ width: `${percentage}%` }}
                    />
                </div>
            );
        }

        // Рендерим приложение
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AnalyticsDashboard />);
    </script>

    <style>
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
